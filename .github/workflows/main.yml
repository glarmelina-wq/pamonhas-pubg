name: Atualizar e publicar Pamonhas

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'logo_do_clan.jpg'
      - 'atualizar_ranking.py'
      - 'membros_cla.txt'
      - 'dicas.js'
      - 'resenha.js'
      - 'trofeus.py'
      - '.github/workflows/main.yml'

concurrency:
  group: pamonhas-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Atualizar dados (mantém publicação anterior se houver falha)
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
        run: python atualizar_ranking.py
      - name: Guardar dados e histórico
        run: |
          git config user.name "Pamonhas Bot"
          git config user.email "bot@pamonhas.pubg"
          git add ranking_cla.json historico_cla.json jogadores_cache.json trofeus_cla.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar estatísticas e histórico do clã"
          fi
          # A coleta demora alguns minutos: alguém pode ter enviado um commit nesse intervalo.
          # Reaplica somente o commit do bot sobre a versão atual, sem force push.
          for tentativa in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
          done
          echo "A branch continuou mudando. Execute novamente a coleta completa."
          exit 1
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site
          cp index.html dicas.js resenha.js ranking_cla.json historico_cla.json trofeus_cla.json _site/
          if [ -f logo_do_clan.jpg ]; then cp logo_do_clan.jpg _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar o site atualizado
        id: deployment
        uses: actions/deploy-pages@v4
